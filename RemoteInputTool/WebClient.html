<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Input</title>
    <style>
        :root { --bg: #1e1e1e; --text: #fff; --accent: #007acc; --panel: #2d2d2d; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        #screenArea { position: relative; flex: none; width: 100vw; height: 56.25vw; max-height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; touch-action: none; overflow: hidden; }
        
        /* ズーム・パン対象のコンテナ */
        #imgContainer { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease-out; }
        #screenImg { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        
        /* グリッドオーバーレイ（画面全体の領域に固定して分割表示） */
        #gridOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        .grid-cell { border: 1px solid rgba(0, 255, 0, 0.5); display: flex; justify-content: center; align-items: center; color: rgba(0, 255, 0, 0.8); font-weight: bold; font-size: 2vw; text-shadow: 1px 1px 2px #000; }
        
        #pointerEffect { position: absolute; width: 30px; height: 30px; border: 2px solid red; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); opacity: 0; }
        #pointerEffect::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
        .pointer-anim { animation: fadeout 1s ease-out forwards; }
        @keyframes fadeout { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }

        #uiContainer { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); }
        #controls { display: flex; padding: 5px; background: var(--panel); gap: 5px; align-items: center; }
        #areaSelect { flex: 2; padding: 10px; background: #3c3c3c; color: white; border: none; border-radius: 5px; font-weight: bold; }
        #actions { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        button { flex: 1; background: #3c3c3c; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; touch-action: manipulation; }
        button:active { background: #555; }
        button.active-tool { background: #e74c3c; }
        .btn-primary { background: var(--accent); }
        #finePad { width: 60px; height: 60px; background: #444; border-radius: 10px; border: 2px solid #666; display: flex; justify-content: center; align-items: center; font-size: 10px; touch-action: none; flex: none; }
        #appGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        #appGrid button { padding: 10px 4px; font-size: 12px; }

        /* ダイアログUI */
        #modeDialog { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 20px; border-radius: 10px; z-index: 100; border: 1px solid #555; width: 80%; max-width: 300px; }
        #modeDialog h3 { margin-top: 0; }
        #modeDialog select { width: 100%; padding: 10px; margin-bottom: 15px; background: #3c3c3c; color: white; border: none; border-radius: 5px; }

        @media (orientation: landscape) {
            #screenArea { height: 100vh; width: 177.77vh; max-width: 100vw; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <div id="screenArea">
        <div id="imgContainer">
            <img id="screenImg" src="" alt="PC画面待ち...">
        </div>
        <div id="gridOverlay"></div>
        <div id="pointerEffect"></div>
    </div>

    <div id="uiContainer">
        <div id="controls">
            <button id="btnConnect" class="btn-primary" style="flex:1;">接続</button>
            <select id="areaSelect" style="flex:2;"></select>
        </div>

        <div id="actions">
            <!-- ツールボタン列 -->
            <div class="btn-group">
                <button id="btnZoom">拡大</button>
                <button id="btnPan">移動</button>
                <button id="btnGrid">グリッド</button>
                <button id="btnMode">モード</button>
            </div>

            <!-- マウス操作列 -->
            <div class="btn-group">
                <button onclick="sendAction({action:'click', button:'left'})" style="flex: 3;">左クリック</button>
                <button id="btnDrag" style="flex: 2;">ドラッグ: OFF</button>
                <button onclick="sendAction({action:'click', button:'right'})" style="flex: 3;">右クリック</button>
            </div>
            
            <div class="btn-group" style="align-items: center;">
                <button onclick="sendAction({action:'scroll', value: 120})" style="height: 60px;">スクロール 上</button>
                <div id="finePad">微調整<br>パッド</div>
                <button onclick="sendAction({action:'scroll', value: -120})" style="height: 60px;">スクロール 下</button>
            </div>

            <div style="font-size:12px; margin-top:5px; color:#aaa;">設定されたアプリ一覧:</div>
            <div id="appGrid"></div>
        </div>
    </div>

    <!-- モード選択ダイアログ -->
    <div id="modeDialog">
        <h3>操作モード設定</h3>
        <label>タップ時の動作:</label>
        <select id="opModeSelect">
            <option value="move">移動モード (ポインター)</option>
            <option value="tapClick">タップクリックモード</option>
        </select>
        <label>グリッド分割数:</label>
        <select id="gridSplitSelect">
            <option value="2">2分割 (左右)</option>
            <option value="4">4分割 (上下左右)</option>
            <option value="9">9分割 (3x3)</option>
        </select>
        <button onclick="document.getElementById('modeDialog').style.display='none'" style="width: 100%; background: var(--accent);">閉じる</button>
    </div>

    <script>
        let ws;
        let isConnected = false;
        let isDragging = false;
        let lastCursor = {x: 0.5, y: 0.5};
        let serverGridConfig = {};

        // 状態変数
        let opMode = "move"; // move or tapClick
        let gridSplit = 2;   // 2, 4, 9
        let gridState = 0;   // 0:OFF, 1:ON(表示), 2:ON(透明)
        let isZoomMode = false;
        let isPanMode = false;

        // CSS Transform用
        let scale = 1.0;
        let translateX = 0;
        let translateY = 0;

        const screenImg = document.getElementById('screenImg');
        const imgContainer = document.getElementById('imgContainer');
        const screenArea = document.getElementById('screenArea');
        const gridOverlay = document.getElementById('gridOverlay');
        const pointerEffect = document.getElementById('pointerEffect');
        const btnConnect = document.getElementById('btnConnect');
        const btnDrag = document.getElementById('btnDrag');
        const areaSelect = document.getElementById('areaSelect');
        const appGrid = document.getElementById('appGrid');
        
        const btnZoom = document.getElementById('btnZoom');
        const btnPan = document.getElementById('btnPan');
        const btnGrid = document.getElementById('btnGrid');
        const btnMode = document.getElementById('btnMode');

        function toggleConnection() {
            if (isConnected) { if(ws) ws.close(); return; }
            ws = new WebSocket(`ws://${window.location.hostname}:5360/`);
            ws.onopen = () => {
                isConnected = true;
                btnConnect.textContent = "切断"; btnConnect.style.background = "#e74c3c";
            };
            ws.onclose = () => {
                isConnected = false;
                btnConnect.textContent = "接続"; btnConnect.style.background = "var(--accent)";
                screenImg.src = ""; appGrid.innerHTML = ""; areaSelect.innerHTML = "";
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === "init") {
                    appGrid.innerHTML = "";
                    msg.apps.forEach(app => {
                        const btn = document.createElement("button");
                        btn.textContent = app.Name;
                        btn.onclick = () => sendAction({action:'launch_app', id: app.Id});
                        appGrid.appendChild(btn);
                    });
                    areaSelect.innerHTML = "<option value='-1'>全画面表示</option>";
                    msg.areas.forEach((area, i) => {
                        const opt = document.createElement("option");
                        opt.value = i; opt.textContent = area.Name;
                        areaSelect.appendChild(opt);
                    });
                    serverGridConfig = {
                        2: msg.grid2.Cells,
                        4: msg.grid4.Cells,
                        9: msg.grid9.Cells
                    };
                    renderGrid();
                } else if (msg.type === "image") {
                    screenImg.src = "data:image/jpeg;base64," + msg.data;
                    if (msg.cursor) lastCursor = msg.cursor;
                }
            };
        }
        btnConnect.addEventListener('click', toggleConnection);

        areaSelect.addEventListener('change', (e) => {
            sendAction({ action: 'change_area', index: parseInt(e.target.value) });
        });

        function sendAction(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
                if (data.action === 'move') showPointerEffect(data.x, data.y);
                else showPointerEffect(lastCursor.x, lastCursor.y);
            }
        }

        btnDrag.addEventListener('click', () => {
            isDragging = !isDragging;
            btnDrag.textContent = `ドラッグ: ${isDragging ? 'ON' : 'OFF'}`;
            btnDrag.style.background = isDragging ? "#e74c3c" : "#3c3c3c";
            sendAction({action:'drag', state: isDragging ? 'down' : 'up'});
        });

        // ツールボタンのトグル処理
        btnZoom.addEventListener('click', () => {
            isZoomMode = !isZoomMode;
            if(isZoomMode) { isPanMode = false; btnPan.classList.remove('active-tool'); }
            btnZoom.classList.toggle('active-tool', isZoomMode);
        });
        btnPan.addEventListener('click', () => {
            isPanMode = !isPanMode;
            if(isPanMode) { isZoomMode = false; btnZoom.classList.remove('active-tool'); }
            btnPan.classList.toggle('active-tool', isPanMode);
        });
        btnMode.addEventListener('click', () => {
            document.getElementById('modeDialog').style.display = 'block';
        });

        // ダイアログ設定変更時
        document.getElementById('opModeSelect').addEventListener('change', e => opMode = e.target.value);
        document.getElementById('gridSplitSelect').addEventListener('change', e => {
            gridSplit = parseInt(e.target.value);
            renderGrid();
        });

        // グリッド状態 0->1->2->0
        btnGrid.addEventListener('click', () => {
            gridState = (gridState + 1) % 3;
            renderGrid();
        });

        function renderGrid() {
            if (gridState === 0) {
                gridOverlay.style.display = 'none';
                btnGrid.classList.remove('active-tool');
                btnGrid.textContent = "グリッド";
                return;
            }
            gridOverlay.style.display = 'grid';
            btnGrid.classList.add('active-tool');
            btnGrid.textContent = gridState === 1 ? "グリッド(表示)" : "グリッド(透明)";

            // グリッドレイアウト構築
            let cols, rows;
            if (gridSplit === 2) { cols = 2; rows = 1; }
            else if (gridSplit === 4) { cols = 2; rows = 2; }
            else if (gridSplit === 9) { cols = 3; rows = 3; }
            gridOverlay.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            gridOverlay.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            
            gridOverlay.innerHTML = '';
            const cellsConfig = serverGridConfig[gridSplit] || [];
            
            for (let i = 0; i < gridSplit; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                if (gridState === 1) { // 表示モードの場合のみテキスト表示
                    const conf = cellsConfig[i];
                    cell.textContent = conf ? (conf.ActionType + "\n" + conf.Detail) : "";
                    cell.style.whiteSpace = "pre";
                    cell.style.border = "1px solid rgba(0, 255, 0, 0.5)";
                } else {
                    cell.style.border = "none";
                }
                gridOverlay.appendChild(cell);
            }
        }

        // 画像の実際の描画領域(transform適用後)から相対座標を計算
        function getRelativeCursorPos(clientX, clientY) {
            const rect = screenImg.getBoundingClientRect();
            let x = (clientX - rect.left) / rect.width;
            let y = (clientY - rect.top) / rect.height;
            return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
        }

        function showPointerEffect(ratioX, ratioY) {
            const rect = screenImg.getBoundingClientRect();
            const px = rect.left + rect.width * ratioX;
            const py = rect.top + rect.height * ratioY;
            pointerEffect.style.left = px + "px";
            pointerEffect.style.top = py + "px";
            pointerEffect.classList.remove("pointer-anim");
            void pointerEffect.offsetWidth; // 強制リフロー
            pointerEffect.classList.add("pointer-anim");
        }

        // ズーム・パン・タップ操作処理
        let touchStartY = 0, touchStartX = 0;
        let initialScale = 1.0, initialTx = 0, initialTy = 0;
        let hasMoved = false;

        function updateTransform() {
            imgContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        screenArea.addEventListener('touchstart', (e) => {
            if (e.target !== screenArea && e.target !== screenImg && e.target !== gridOverlay && !e.target.classList.contains('grid-cell')) return;
            e.preventDefault();
            hasMoved = false;
            const touch = e.touches[0];

            if (isZoomMode) {
                touchStartY = touch.clientY;
                initialScale = scale;
                const rect = imgContainer.getBoundingClientRect();
                let ox = ((touch.clientX - rect.left) / rect.width) * 100;
                let oy = ((touch.clientY - rect.top) / rect.height) * 100;
                imgContainer.style.transformOrigin = `${ox}% ${oy}%`;
            } else if (isPanMode) {
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                initialTx = translateX;
                initialTy = translateY;
            }
        });

        screenArea.addEventListener('touchmove', (e) => {
            if (e.target !== screenArea && e.target !== screenImg && e.target !== gridOverlay && !e.target.classList.contains('grid-cell')) return;
            e.preventDefault();
            hasMoved = true;
            const touch = e.touches[0];

            if (isZoomMode) {
                let dy = touchStartY - touch.clientY; // 上スワイプ(dy>0)で縮小
                scale = Math.max(1.0, Math.min(5.0, initialScale - dy * 0.01));
                updateTransform();
            } else if (isPanMode) {
                translateX = initialTx + (touch.clientX - touchStartX);
                translateY = initialTy + (touch.clientY - touchStartY);
                updateTransform();
            } else if (gridState === 0 && opMode === "move") {
                // 移動(ポインター)モード中のリアルタイム送信
                const pos = getRelativeCursorPos(touch.clientX, touch.clientY);
                sendAction({ action: "move", x: pos.x, y: pos.y });
            }
        });

        screenArea.addEventListener('touchend', (e) => {
            if (isZoomMode || isPanMode || hasMoved) return; // ツール中またはスワイプした場合はタップ判定しない
            
            // タップ(Tap)イベント発火
            const touch = e.changedTouches[0];
            
            if (gridState === 1 || gridState === 2) {
                // グリッドタップ判定（画面全体の領域に対する比率）
                const rect = screenArea.getBoundingClientRect();
                let rx = (touch.clientX - rect.left) / rect.width;
                let ry = (touch.clientY - rect.top) / rect.height;
                let col = 0, row = 0, cols = 1;
                
                if (gridSplit === 2) { cols = 2; col = rx < 0.5 ? 0 : 1; }
                else if (gridSplit === 4) { cols = 2; col = rx < 0.5 ? 0 : 1; row = ry < 0.5 ? 0 : 1; }
                else if (gridSplit === 9) { cols = 3; col = Math.floor(rx * 3); row = Math.floor(ry * 3); }
                
                col = Math.min(cols - 1, Math.max(0, col));
                let maxRow = gridSplit / cols;
                row = Math.min(maxRow - 1, Math.max(0, row));
                
                let idx = row * cols + col;
                sendAction({ action: "grid_action", split: gridSplit, index: idx });
                
                // エフェクトをタップ位置に出す
                pointerEffect.style.left = touch.clientX + "px";
                pointerEffect.style.top = touch.clientY + "px";
                pointerEffect.classList.remove("pointer-anim");
                void pointerEffect.offsetWidth;
                pointerEffect.classList.add("pointer-anim");

            } else {
                // グリッドOFF時
                const pos = getRelativeCursorPos(touch.clientX, touch.clientY);
                if (opMode === "move") {
                    sendAction({ action: "move", x: pos.x, y: pos.y });
                } else if (opMode === "tapClick") {
                    // カーソル移動して即左クリック
                    sendAction({ action: "move", x: pos.x, y: pos.y });
                    setTimeout(() => sendAction({action:'click', button:'left'}), 50);
                }
            }
        });

        // 微調整パッド
        const finePad = document.getElementById('finePad');
        let fineTouch = null;
        finePad.addEventListener('touchstart', (e) => { e.preventDefault(); fineTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
        finePad.addEventListener('touchmove', (e) => {
            e.preventDefault(); if(!fineTouch) return;
            let cur = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            let dx = Math.round(cur.x - fineTouch.x), dy = Math.round(cur.y - fineTouch.y);
            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) { sendAction({ action: "move_rel", dx: dx, dy: dy }); fineTouch = cur; }
        });
        finePad.addEventListener('touchend', () => { fineTouch = null; });
    </script>
</body>
</html>
