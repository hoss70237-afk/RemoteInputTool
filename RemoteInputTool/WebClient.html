<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Input</title>
    <style>
        :root { --bg: #1e1e1e; --text: #fff; --accent: #007acc; --panel: #2d2d2d; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        /* 画像エリア */
        #screenArea { position: relative; flex: none; height: 45vh; background: #000; border-bottom: 2px solid var(--panel); display: flex; justify-content: center; align-items: center; touch-action: none; }
        #screenImg { max-width: 100%; max-height: 100%; object-fit: contain; }
        #reticle { position: absolute; width: 20px; height: 20px; border: 2px solid red; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); display: none; }
        #reticle::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
        
        /* グリッドオーバーレイ */
        #gridOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
        .grid-cell { border: 1px dashed transparent; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-size: 10px; color: rgba(255,255,255,0.5); }
        body.setting-mode .grid-cell { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); }
        body.setting-mode .grid-cell.selected { background: rgba(0,122,204,0.5); border-color: #007acc; }

        /* コントロール & 操作エリア */
        #controls { display: flex; padding: 5px; background: var(--panel); gap: 5px; }
        #actions { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        
        button { flex: 1; background: #3c3c3c; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; touch-action: manipulation; }
        button:active { background: #555; }
        .btn-primary { background: var(--accent); }
        
        /* 微調整パッド */
        #finePad { width: 60px; height: 60px; background: #444; border-radius: 10px; border: 2px solid #666; display: flex; justify-content: center; align-items: center; font-size: 10px; touch-action: none; margin: 0 auto; }
        
        /* アプリグリッド */
        #appGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        #appGrid button { padding: 8px 4px; font-size: 11px; }
    </style>
</head>
<body>

    <!-- 画像表示・タッチエリア -->
    <div id="screenArea">
        <img id="screenImg" src="" alt="Waiting for PC...">
        <div id="reticle"></div>
        <div id="gridOverlay">
            <!-- 3x3 の9分割グリッド -->
            <div class="grid-cell" data-idx="0"></div><div class="grid-cell" data-idx="1"></div><div class="grid-cell" data-idx="2"></div>
            <div class="grid-cell" data-idx="3"></div><div class="grid-cell" data-idx="4"></div><div class="grid-cell" data-idx="5"></div>
            <div class="grid-cell" data-idx="6"></div><div class="grid-cell" data-idx="7"></div><div class="grid-cell" data-idx="8"></div>
        </div>
    </div>

    <!-- 中央コントロール -->
    <div id="controls">
        <button id="btnConnect" class="btn-primary">接続/切断</button>
        <button id="btnSettings" style="background: #e67e22;">設定モード: OFF</button>
    </div>

    <!-- 下部アクション -->
    <div id="actions">
        <div class="btn-group">
            <button onclick="sendAction({action:'click', button:'left'})">左クリック</button>
            <button onclick="sendAction({action:'click', button:'right'})">右クリック</button>
            <button id="btnDrag">ドラッグ: OFF</button>
        </div>
        <div class="btn-group">
            <button onclick="sendAction({action:'scroll', value: 120})">スクロール 上</button>
            <button onclick="sendAction({action:'scroll', value: -120})">スクロール 下</button>
            <div id="finePad">微調整<br>パッド</div>
        </div>
        <div style="font-size:12px; margin-top:5px;">アプリ起動:</div>
        <div id="appGrid">
            <!-- アプリボタン 1〜10 -->
            <script>
                for(let i=1; i<=10; i++) {
                    document.write(`<button onclick="sendAction({action:'launch_app', id:${i}})">App${i}</button>`);
                }
            </script>
        </div>
    </div>

    <script>
        let ws;
        let isConnected = false;
        let isSettingMode = false;
        let isDragging = false;
        let selectedGridCell = null;
        let gridConfig = {}; // グリッドの割り当て保存用

        const screenImg = document.getElementById('screenImg');
        const reticle = document.getElementById('reticle');
        const btnConnect = document.getElementById('btnConnect');
        const btnSettings = document.getElementById('btnSettings');
        const btnDrag = document.getElementById('btnDrag');

        // WebSocket 接続管理
        function toggleConnection() {
            if (isConnected) {
                if(ws) ws.close();
                return;
            }
            const host = window.location.hostname;
            ws = new WebSocket(`ws://${host}:5360/`);
            
            ws.onopen = () => {
                isConnected = true;
                btnConnect.textContent = "切断";
                btnConnect.style.background = "#e74c3c";
            };
            ws.onclose = () => {
                isConnected = false;
                btnConnect.textContent = "接続";
                btnConnect.style.background = "var(--accent)";
                screenImg.src = "";
                reticle.style.display = "none";
            };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === "image") {
                    screenImg.src = "data:image/jpeg;base64," + msg.data;
                    // レティクルの更新 (PC側からカーソル座標が来る場合)
                    if (msg.cursor) {
                        reticle.style.display = "block";
                        reticle.style.left = (msg.cursor.x * 100) + "%";
                        reticle.style.top = (msg.cursor.y * 100) + "%";
                    }
                }
            };
        }
        btnConnect.addEventListener('click', toggleConnection);

        // データ送信汎用関数
        function sendAction(data) {
            // 設定モードでグリッドセルが選択されている場合、アクションを割り当てて終了
            if (isSettingMode && selectedGridCell !== null) {
                gridConfig[selectedGridCell] = data;
                document.querySelector(`.grid-cell[data-idx="${selectedGridCell}"]`).textContent = data.action === 'launch_app' ? `App${data.id}` : data.action;
                
                document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
                selectedGridCell = null;
                alert("割り当てました");
                return;
            }
            // 通常送信
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        // ドラッグホールド切り替え
        btnDrag.addEventListener('click', () => {
            isDragging = !isDragging;
            btnDrag.textContent = `ドラッグ: ${isDragging ? 'ON' : 'OFF'}`;
            btnDrag.style.background = isDragging ? "#e74c3c" : "#3c3c3c";
            sendAction({action:'drag', state: isDragging ? 'down' : 'up'});
        });

        // 画面領域 (絶対座標) のタッチ操作
        const gridOverlay = document.getElementById('gridOverlay');
        gridOverlay.addEventListener('touchmove', (e) => {
            if (isSettingMode) return; // 設定モード時は移動無効
            e.preventDefault();
            const rect = gridOverlay.getBoundingClientRect();
            const touch = e.touches[0];
            let x = (touch.clientX - rect.left) / rect.width;
            let y = (touch.clientY - rect.top) / rect.height;
            x = Math.max(0, Math.min(1, x));
            y = Math.max(0, Math.min(1, y));
            sendAction({ action: "move", x: x, y: y });
        });

        // グリッドセルのタップ (割り当て機能)
        document.querySelectorAll('.grid-cell').forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const idx = cell.getAttribute('data-idx');
                
                if (isSettingMode) {
                    // 割り当て先として選択
                    document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                    selectedGridCell = idx;
                } else {
                    // 通常モード：割り当てられたアクションを実行
                    if (gridConfig[idx]) {
                        sendAction(gridConfig[idx]);
                    } else {
                        // 割り当てがない場合は、その場所の座標へ移動
                        const rect = gridOverlay.getBoundingClientRect();
                        const touch = e.touches[0];
                        let x = (touch.clientX - rect.left) / rect.width;
                        let y = (touch.clientY - rect.top) / rect.height;
                        sendAction({ action: "move", x: x, y: y });
                    }
                }
            });
        });

        // 微調整パッド (相対座標) のタッチ操作
        const finePad = document.getElementById('finePad');
        let lastTouch = null;
        finePad.addEventListener('touchstart', (e) => {
            e.preventDefault();
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        finePad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(!lastTouch) return;
            let current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            let dx = Math.round(current.x - lastTouch.x);
            let dy = Math.round(current.y - lastTouch.y);
            
            // 少しでも動いたら送信（感度調整用に係数を掛けてもよい）
            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                sendAction({ action: "move_rel", dx: dx, dy: dy });
                lastTouch = current;
            }
        });
        finePad.addEventListener('touchend', () => { lastTouch = null; });

        // 設定モード切替
        btnSettings.addEventListener('click', () => {
            isSettingMode = !isSettingMode;
            document.body.classList.toggle('setting-mode', isSettingMode);
            btnSettings.textContent = `設定モード: ${isSettingMode ? 'ON' : 'OFF'}`;
            selectedGridCell = null;
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
        });

    </script>
</body>
</html>
