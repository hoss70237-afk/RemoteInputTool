name: Build App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build Project
      # フォルダの中にある csproj を指定
      run: dotnet build RemoteInputTool/RemoteInputTool.csproj -c Release

    - name: Upload EXE File
      uses: actions/upload-artifact@v4
      with:
        name: RemoteInputTool-App
        # 出力先のパスもフォルダの中に合わせる
        path: RemoteInputTool/bin/Release/net472/
