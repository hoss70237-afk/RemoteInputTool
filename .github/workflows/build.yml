name: Build App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build Project
      run: dotnet build RemoteInputTool.csproj -c Release

    - name: Upload EXE File
      uses: actions/upload-artifact@v4
      with:
        name: RemoteInputTool-App
        path: bin/Release/net472/
